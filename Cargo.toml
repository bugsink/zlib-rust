[package]
name = "zlib-rust-python"
version = "0.6.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Python bindings for zlib-rs"
repository = "https://github.com/bugsink/zlib-rust"
exclude = ["GH_TOKEN*"]

[lib]
name = "_zlib_rust"
crate-type = ["cdylib"]

[dependencies]
zlib-rs = { version = "=0.6.1", default-features = false, features = ["std"] }
pyo3 = { version = "=0.30.1", features = ["abi3-py311", "extension-module"] }
