version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      exclude:
        - zlib-rs
    groups:
      rust-zlib:
        patterns:
          - zlib-rs
      other-rust:
        patterns:
          - "*"
        exclude-patterns:
          - zlib-rs

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # This action reference is also the toolchain version in the MSRV job.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      all-actions:
        patterns:
          - "*"
